<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grit</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="tabs"></nav>
  <section id="actions" class="section" style="display: none;">
    <h2 class="section-title">Actions <span class="arrow">&#9662;</span></h2>
    <div class="section-body">
      <div class="action-row">
        <button id="pull-btn" title="Fetch remote changes and merge them into the current branch">Pull</button>
        <button id="push-btn" title="Push local commits to the remote">Push</button>
        <button id="fetch-btn" title="Download remote changes without merging them">Fetch</button>
        <button id="reclone-btn" class="danger" title="Delete the repo directory and clone it fresh from origin — local branches, stashes, and unpushed work are lost">Reclone</button>
        <button id="remove-tab-btn" class="danger" title="Remove this tab from Grit (the repository on disk is kept)">Remove</button>
        <select id="script-select" title="Executables discovered in the repo root, scripts/, and tools/" style="display: none;"></select>
        <button id="run-script-btn" title="Launch the selected script detached; Grit does not track it afterwards" style="display: none;">Run</button>
        <button id="clear-log-btn" type="button" title="Hide everything logged so far; new commands still appear">Clear Log</button>
      </div>
    </div>
  </section>
  <main>
    <section id="add-repo-form" class="section" style="display: none;">
      <h2 class="section-title">Add Repository <span class="arrow">&#9662;</span></h2>
      <div class="section-body">
        <div class="form-group">
          <label for="new-repo-path">Directory</label>
          <input id="new-repo-path" type="text" placeholder="~/projects/my-repo">
          <div id="folder-browser" class="folder-browser">
            <div class="browser-bar">
              <code id="browser-current"></code>
              <span class="browser-nav">
                <button id="browser-up-btn" type="button">Up</button>
                <button id="browser-home-btn" type="button">Home</button>
              </span>
            </div>
            <div id="browser-entries" class="browser-entries"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="new-repo-name">Name</label>
          <input id="new-repo-name" type="text" placeholder="my project">
        </div>
        <div class="form-group">
          <div id="new-repo-error" class="error" style="display: none;"></div>
        </div>
        <div class="form-actions">
          <button id="open-repo-btn" class="primary">Open Repository</button>
          <button id="cancel-repo-btn">Cancel</button>
        </div>
      </div>
    </section>
    <section id="repo-view" class="section" style="display: none;">
      <h2 class="section-title"><span>Changes <span id="overview" class="muted"></span></span><span class="arrow">&#9662;</span></h2>
      <div class="section-body">
        <div class="commit-bar">
          <input id="commit-msg" type="text" placeholder="Commit message">
          <button id="stage-commit-push-btn" title="Stage all changes, commit, and push to remote">Stage All + Commit + Push</button>
          <button id="commit-push-btn" title="Commit staged changes and push to remote">Commit Staged + Push</button>
          <button id="commit-btn" title="Commit staged changes locally">Commit</button>
          <button id="discard-all-btn" class="danger" title="Discard all uncommitted changes">Discard All</button>
        </div>
        <div id="changes"></div>
      </div>
    </section>
    <section id="history-section" class="section" style="display: none;">
      <h2 class="section-title">History <span class="arrow">&#9662;</span></h2>
      <div class="section-body">
        <input id="history-search" type="text" placeholder="Search full history (hash, author, message)">
        <div id="history"></div>
      </div>
    </section>
    <section id="log-section" class="section" style="display: none;">
      <h2 class="section-title">Log <span class="arrow">&#9662;</span></h2>
      <div class="section-body">
        <div id="log"></div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
