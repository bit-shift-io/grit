<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grit</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="tabs"></nav>
  <section id="actions" class="section">
    <h2 class="section-title">Actions <span class="arrow">&#9662;</span></h2>
    <div class="section-body">
      <div id="overview" class="muted"></div>
      <div class="action-row">
        <button id="pull-btn">Pull</button>
        <button id="push-btn">Push</button>
        <button id="fetch-btn">Fetch</button>
        <button id="nuke-btn" class="danger">Nuke</button>
        <span id="nuke-status" class="nuke-status"></span>
      </div>
    </div>
  </section>
  <main>
    <section class="section">
      <h2 class="section-title">Changes <span class="arrow">&#9662;</span></h2>
      <div class="section-body">
        <div class="commit-bar">
          <input id="commit-msg" type="text" placeholder="Commit message">
          <button id="commit-push-btn">Commit + Push</button>
          <button id="commit-btn">Commit</button>
          <button id="discard-all-btn" class="danger">Discard All</button>
        </div>
        <div id="changes"></div>
      </div>
    </section>
    <section class="section">
      <h2 class="section-title">History <span class="arrow">&#9662;</span></h2>
      <div class="section-body">
        <div id="history"></div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
