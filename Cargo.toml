[package]
name = "grit"
version = "0.1.0"
edition = "2021"
description = "Fast, native, single-binary Git client with desktop GUI and embedded web daemon"
license = "MIT"

[[bin]]
name = "grit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
iced = "0.14"
axum = { version = "0.8", features = ["ws", "tokio", "http1"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
futures-channel = "0.3"
notify = "8"
rust-embed = { version = "8", features = ["mime-guess"] }
clap = { version = "4", features = ["derive"] }
rfd = "0.15"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-tungstenite = "0.30"
freedesktop-desktop-entry = "0.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
