[package]
name = "grit"
version = "0.1.0"
edition = "2021"
description = "Fast, native, single-binary Git client with desktop GUI and embedded web daemon"
license = "MIT"

[[bin]]
name = "grit"
path = "src/main.rs"

[features]
default = []
# Native desktop GUI on top of the embedded web daemon. The default build
# is web-only; pass `--features desktop` for the full desktop + web UI.
desktop = ["dep:iced", "dep:rfd", "dep:futures-channel", "dep:tokio-tungstenite"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "tokio", "http1"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
futures-channel = { version = "0.3", optional = true }
notify = "8"
rust-embed = { version = "8", features = ["mime-guess"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
freedesktop-desktop-entry = "0.8"

# Desktop GUI only (enabled via the `desktop` feature).
iced = { version = "0.14", optional = true }
rfd = { version = "0.15", optional = true }
tokio-tungstenite = { version = "0.30", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Test WebSocket client needs tungstenite even in web-only builds.
tokio-tungstenite = "0.30"

[profile.release]
opt-level = 3
